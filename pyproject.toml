[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sayelf-agent-ops"
version = "0.3.0a1"
description = "Sayelf Agent Ops: Human + Multi-Agent execution and trusted delivery"
requires-python = ">=3.11"

[project.scripts]
sayelf-agent-ops-demo = "sayelf_agent_ops.demo:main"

[tool.setuptools.packages.find]
include = ["sayelf_agent_ops", "sayelf_agent_ops.*"]
